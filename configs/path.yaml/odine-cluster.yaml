---
apiVersion: "ran.openshift.io/v1"
kind: "SiteConfig"
metadata:
  name: "odine-cluster"
  namespace: "odine-test"
spec:
  baseDomain: "odine.com"
  clusterImageSetNameRef: "odine-image"
  sshPublicKey: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC4."
  pullSecretRef:
    name: "secrets/machines/s.txt"
  clusters:
  - clusterName: "odine-cluster"
    extraManifestPath: ""
    extraManifests:
      filter:
        inclusionDefault: "exclude"
        include: []
    networkType: "OVNKubernetes"
    clusterLabels:
      cwl: true
      cnf: "mav-common"
      config-ver: "2025-01-22"
      test: "test"
    clusterNetwork:
    - cidr: "192.168.1.0/24"
      hostPrefix: 24
    machineNetwork:
    - cidr: "192.168.1.0/24"
    apiVIP: "192.168.1.0"
    ingressVIP: "192.168.1.0"
    serviceNetwork:
    - "171.164.2.0/24"
    additionalNTPSources:
    - "10.10.20.140"
    - "ntp.pool.org"
    nodes:
    - hostName: "odine.worker.tgc"
      role: "master"
      bmcAddress: "192.168.65.3"
      bmcCredentialsName:
        name: "bmc-credentials-0"
      nodeLabels:
        openshift-storage: "test"
      bootMode: "UEFISecureBoot"
      rootDeviceHints:
        vendor: "ZTE"
        deviceName: "dev/sda"
        size: 90
      bootMACAddress: "40:A6:B7:88:84:5C"
      nodeNetwork:
        interfaces:
        - name: "ens1f0"
          macAddress: "04:32:01:52:74:70"
        - name: "ens1f1"
          macAddress: "04:32:01:52:74:71"
        - name: "ens2f0"
          macAddress: "C4:CB:E1:B5:89:01"
        config:
          interfaces:
          - ipv4:
              enabled: false
            ipv6:
              enabled: false
            name: "ens1f0"
            state: "up"
            type: "ethernet"
            mtu: 9000
          - ipv4:
              enabled: false
            ipv6:
              enabled: false
            name: "ens1f1"
            state: "up"
            type: "ethernet"
            mtu: 9000
          - ipv4:
              enabled: false
            ipv6:
              enabled: false
            name: "ens2f0"
            state: "up"
            type: "ethernet"
            mtu: 9000
          - ipv4:
              enabled: false
            link-aggregation:
              mode: "active-backup"
              port:
              - "ens1f0: 04:32:01:52:74:70"
              - "ens2f0: C4:CB:E1:B5:89:01"
              options:
                miimon: "100"
            ipv6:
              enabled: false
            name: "bond0"
            description: "bond for network transfer"
            state: "up"
            type: "bond"
            mtu: 9000
          - vlan:
              base-iface: "bond0"
              id: 0
            ipv4:
              enabled: false
            ipv6:
              enabled: false
            name: "bond0.0"
            state: "up"
            type: "vlan"
            mtu: 9000
          dns-resolver:
            config:
              server:
              - "8.8.8.8"
          routes:
            config:
            - next-hop-interface: ""
              destination: "0.0.0.0/0"
              next-hop-address: ""
